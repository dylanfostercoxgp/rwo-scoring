<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="RWO Scoring">
<meta name="theme-color" content="#0b1f3a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>RWO Scoring</title>
<style>
  :root { --navy: #0b1f3a; --green: #1e8e3e; --green2: #34a853; --red: #d93025; --amber: #f9ab00; --gray: #9aa0a6; --bg: #eef1f5; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: #111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; touch-action: manipulation; }
  body { padding-bottom: env(safe-area-inset-bottom); }
  button, select, input { font: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  #top { position: sticky; top: 0; z-index: 20; background: var(--navy); color: #fff; padding: calc(6px + env(safe-area-inset-top)) 10px 0; }
  #top .row1 { display: flex; align-items: center; gap: 10px; }
  #brand { font-weight: 800; font-size: 18px; letter-spacing: .02em; }
  #evname { color: #cfd8e3; font-size: 14px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sync { font-size: 14px; font-weight: 700; padding: 6px 12px; border-radius: 16px; background: #1e8e3e; white-space: nowrap; }
  #sync.off { background: var(--amber); color: #111; }
  #sync.err { background: var(--red); }
  #tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 6px; }
  #tabs button { flex: 1; min-width: 92px; background: transparent; color: #cfd8e3; border: 0; padding: 12px 8px; font-size: 16px; font-weight: 600; border-bottom: 4px solid transparent; position: relative; }
  #tabs button.on { color: #fff; border-bottom-color: #fff; }
  #tabs .dot { position: absolute; top: 6px; right: 8px; background: var(--red); color: #fff; font-size: 11px; border-radius: 9px; padding: 1px 6px; }
  #practice { display: none; background: #7b1fa2; color: #fff; text-align: center; font-weight: 700; padding: 6px; }
  body.practice #practice { display: block; }
  main { padding: 10px; }
  .view { display: none; }
  .view.on { display: block; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .bar select { font-size: 18px; padding: 10px; border-radius: 8px; border: 1px solid #bbb; background: #fff; max-width: 100%; }
  .seg { display: inline-flex; border: 2px solid var(--navy); border-radius: 10px; overflow: hidden; }
  .seg button { background: #fff; border: 0; padding: 10px 14px; font-size: 15px; font-weight: 700; color: var(--navy); }
  .seg button.on { background: var(--navy); color: #fff; }
  .btn { border: 0; border-radius: 10px; padding: 12px 18px; font-size: 17px; font-weight: 800; background: var(--navy); color: #fff; }
  .btn.red { background: var(--red); }
  .btn.green { background: var(--green); }
  .btn.gray { background: #dadce0; color: #111; }
  .btn.amber { background: var(--amber); color: #111; }
  .btn.small { padding: 8px 12px; font-size: 14px; }
  .btn:disabled { opacity: .45; }
  .spacer { flex: 1; }
  .starts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; margin-bottom: 10px; }
  .start { background: #fff; border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; border: 2px solid #dadce0; }
  .start .lbl { flex: 1; font-size: 15px; }
  .start .lbl b { font-size: 17px; display: block; }
  .start .clock { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 140px; text-align: right; }
  .start .go { font-size: 22px; padding: 16px 26px; }
  .banner { padding: 12px 14px; border-radius: 10px; font-weight: 700; margin-bottom: 10px; font-size: 17px; }
  .banner.red { background: var(--red); color: #fff; }
  .banner.done { background: #e6f4ea; color: #137333; }
  .banner.info { background: #fff8e1; color: #6b4e00; }
  .clshead { font-weight: 800; font-size: 16px; margin: 12px 2px 6px; display: flex; gap: 8px; align-items: center; }
  .clshead i { display: inline-block; width: 16px; height: 16px; border-radius: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tile { position: relative; background: #fff; border-radius: 14px; border: 3px solid #c8ccd2; min-height: 150px; padding: 26px 8px 46px; text-align: center; user-select: none; -webkit-user-select: none; overflow: hidden; }
  .tile .band { position: absolute; top: 0; left: 0; right: 0; height: 22px; font-size: 12px; font-weight: 800; color: #fff; line-height: 22px; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; overflow: hidden; }
  .tile .num { font-size: 50px; font-weight: 900; line-height: 1; margin-top: 4px; }
  .tile .team { font-size: 12px; color: #444; height: 30px; overflow: hidden; margin-top: 2px; }
  .tile .laps { font-size: 20px; font-weight: 800; }
  .tile .last { font-size: 13px; color: #555; font-variant-numeric: tabular-nums; }
  .tile .undo { position: absolute; left: 6px; right: 6px; bottom: 6px; height: 34px; border: 0; border-radius: 8px; background: #eceff3; color: #333; font-weight: 800; font-size: 15px; }
  .tile.tapped { background: var(--green2); border-color: var(--green); color: #fff; }
  .tile.tapped .team, .tile.tapped .last { color: #eafff0; }
  .tile.tapped .big { position: absolute; inset: 22px 0 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--green2); font-weight: 900; font-size: 26px; }
  .tile.tapped .big small { font-size: 15px; font-weight: 700; }
  .tile.tapped .big .bn { font-size: 44px; line-height: 1; }
  .tile.finished { background: var(--green); border-color: #0d652d; color: #fff; }
  .tile.finished .team, .tile.finished .last { color: #d7f5df; }
  .tile.out { background: #e8eaed; color: #777; border-color: #dadce0; }
  .tile.flash { animation: flash .35s; }
  @keyframes flash { from { transform: scale(.94); } to { transform: scale(1); } }
  .tile .stat { font-size: 14px; font-weight: 900; letter-spacing: .04em; }
  .card { background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .card h3 { margin: 0 0 8px; font-size: 18px; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; }
  th { text-align: left; background: #eef0f3; padding: 8px; font-size: 12px; text-transform: uppercase; white-space: nowrap; }
  td { padding: 8px; border-top: 1px solid #eceef1; white-space: nowrap; }
  td.wrap { white-space: normal; }
  .muted { color: #5f6368; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 800; background: #e8eaed; }
  .pill.green { background: #e6f4ea; color: #137333; } .pill.red { background: #fce8e6; color: #a50e0e; } .pill.amber { background: #fef7e0; color: #7a5200; }
  label.f { display: block; margin: 10px 0 4px; font-weight: 700; }
  input.f, select.f { width: 100%; font-size: 18px; padding: 12px; border: 1px solid #bbb; border-radius: 8px; background: #fff; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; z-index: 50; align-items: flex-start; justify-content: center; padding: 40px 12px; overflow-y: auto; }
  #modal.on { display: flex; }
  #modal .box { background: #fff; border-radius: 14px; padding: 18px; width: 100%; max-width: 640px; }
  #modal h2 { margin: 0 0 10px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
  #toast div { background: #202124; color: #fff; padding: 12px 18px; border-radius: 10px; font-weight: 700; font-size: 16px; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
  #toast div.err { background: var(--red); }
  #toast div.ok { background: var(--green); }
  .flag { border-left: 6px solid var(--amber); }
  .opt { display: block; width: 100%; text-align: left; margin: 8px 0; padding: 14px; border-radius: 10px; border: 2px solid #dadce0; background: #fff; font-size: 16px; }
  .opt.on { border-color: var(--navy); background: #e8f0fe; }
  .opt b { font-size: 18px; display: block; }
  .qtile { background: #fff; border-radius: 12px; border: 3px solid #c8ccd2; padding: 10px; display: flex; flex-direction: column; gap: 6px; text-align: center; }
  .qtile .num { font-size: 40px; font-weight: 900; }
  .qtile.on { border-color: var(--amber); background: #fff8e1; }
  .qtile.done { border-color: var(--green); background: #e6f4ea; }
  .qtile .clock { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .qtile .row { display: flex; gap: 6px; }
  .qtile .row button { flex: 1; }
</style>
</head>
<body>
<div id="top">
  <div class="row1">
    <div id="brand">RWO SCORING</div>
    <div id="evname"></div>
    <div id="sync">...</div>
  </div>
  <div id="tabs">
    <button data-v="race" class="on">Race</button>
    <button data-v="review">Review</button>
    <button data-v="edit">Edit &amp; Penalties</button>
    <button data-v="results">Results</button>
    <button data-v="points">Points</button>
    <button data-v="qual">Qualifying</button>
    <button data-v="log">Log</button>
    <button data-v="settings">Settings</button>
  </div>
</div>
<div id="practice">PRACTICE MODE: nothing here is sent to the Sheet</div>
<main>
  <section class="view on" id="v-race"></section>
  <section class="view" id="v-review"></section>
  <section class="view" id="v-edit"></section>
  <section class="view" id="v-results"></section>
  <section class="view" id="v-points"></section>
  <section class="view" id="v-qual"></section>
  <section class="view" id="v-log"></section>
  <section class="view" id="v-settings"></section>
</main>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>

<script src="engine.js"></script>
<script>
'use strict';
var VERSION = '3.0.1';
var LOCK_MS = 30000;
var COLORS = ['#1a73e8', '#d93025', '#188038', '#e37400', '#8430ce', '#007b83', '#b31412', '#5f6368', '#c26401', '#3949ab', '#00897b', '#6d4c41'];
var DEMO_CFG = {
  entries: [
    { cls: 'Class 1', num: '03', team: 'Demo Racing South' }, { cls: 'Class 1', num: '5', team: 'Demo Five' }, { cls: 'Class 1', num: '11', team: 'Demo Eleven' },
    { cls: 'Class 1', num: '22', team: 'Demo Heroes' }, { cls: 'Super Vee', num: '5', team: 'Vee Five' }, { cls: 'Super Vee', num: '7', team: 'Vee Seven' },
    { cls: 'Super Vee', num: '12', team: 'Vee Twelve' }, { cls: 'Modified Vee', num: '42', team: 'Mod Forty-Two' }, { cls: 'Modified Vee', num: '44', team: 'Mod Forty-Four' }
  ],
  starts: [
    { day: 'Sat', race: 1, start: 1, laps: 4, classes: ['Class 1'] },
    { day: 'Sat', race: 2, start: 1, laps: 3, classes: ['Super Vee'] },
    { day: 'Sat', race: 2, start: 2, laps: 3, classes: ['Modified Vee'] }
  ]
};

/* ================= settings (small, in localStorage) ================= */
var S = load('rwo_settings') || {};
if (!S.dev) { S.dev = 'D' + Math.random().toString(36).slice(2, 7).toUpperCase(); }
S.sort = S.sort || 'num';
S.view = S.view || 'race';
save('rwo_settings', S);
function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function saveS() { save('rwo_settings', S); }
function NS() { return S.practice ? 'rwo_practice' : 'rwo_live'; }

/* ================= storage (IndexedDB on the iPad) ================= */
var DB = null, EVENTS = [], BYID = {}, PENDING = {}, META = { lastRow: 0 };
function openDB(name) {
  return new Promise(function (res, rej) {
    var r = indexedDB.open(name, 1);
    r.onupgradeneeded = function () { var d = r.result; d.createObjectStore('events', { keyPath: 'id' }); d.createObjectStore('meta'); };
    r.onsuccess = function () { res(r.result); };
    r.onerror = function () { rej(r.error); };
  });
}
function tx(store, mode, fn) {
  return new Promise(function (res, rej) {
    var t = DB.transaction(store, mode), s = t.objectStore(store), out = fn(s);
    t.oncomplete = function () { res(out && out.result !== undefined ? out.result : undefined); };
    t.onerror = function () { rej(t.error); };
    t.onabort = function () { rej(t.error); };
  });
}
function putEvent(e, synced) { var c = Object.assign({}, e, { _s: synced ? 1 : 0 }); return tx('events', 'readwrite', function (s) { return s.put(c); }); }
function saveMeta() { return tx('meta', 'readwrite', function (s) { return s.put(META, 'meta'); }); }
function backupPending() { var list = Object.keys(PENDING).map(function (id) { return BYID[id]; }).filter(Boolean); save(NS() + '_pending', list); }

async function initData() {
  DB = await openDB(NS());
  EVENTS = []; BYID = {}; PENDING = {};
  var all = await tx('events', 'readonly', function (s) { return s.getAll(); });
  (all || []).forEach(function (e) { var s = e._s; delete e._s; EVENTS.push(e); BYID[e.id] = e; if (!s) PENDING[e.id] = 1; });
  // safety net: anything that only made it into the localStorage backup
  (load(NS() + '_pending') || []).forEach(function (e) { if (e && e.id && !BYID[e.id]) { EVENTS.push(e); BYID[e.id] = e; PENDING[e.id] = 1; putEvent(e, false); } });
  META = (await tx('meta', 'readonly', function (s) { return s.get('meta'); })) || { lastRow: 0 };
  document.body.classList.toggle('practice', !!S.practice);
  dirty();
}

var idn = 0;
function newId() { return S.dev + '-' + Date.now().toString(36) + '-' + (idn++).toString(36) + Math.random().toString(36).slice(2, 5); }

function addEvent(o) {
  var e = Object.assign({ id: newId(), at: Date.now(), dev: S.dev, devName: S.devName || S.dev, who: META.who || S.devName || '' }, o);
  EVENTS.push(e); BYID[e.id] = e;
  if (!S.practice) PENDING[e.id] = 1;
  putEvent(e, !!S.practice).catch(function (err) { toast('iPad storage problem: ' + err, 'err'); });
  if (!S.practice) backupPending();
  dirty();
  if (!S.practice) setTimeout(syncNow, 150);
  return e;
}

function markSynced(id) {
  if (!PENDING[id]) return;
  delete PENDING[id];
  if (BYID[id]) putEvent(BYID[id], true);
}

/* ================= sync with the Google Sheet ================= */
var syncing = false, lastOk = 0, lastErr = '';
function fetchJson(url, opts) {
  var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, 45000);
  return fetch(url, Object.assign({ signal: ctl.signal, redirect: 'follow', cache: 'no-store' }, opts || {}))
    .then(function (r) { return r.json(); }).finally(function () { clearTimeout(timer); });
}
async function syncNow() {
  if (S.practice || !S.url || !S.pin || syncing) { syncBadge(); return; }
  syncing = true;
  try {
    var pend = Object.keys(PENDING).map(function (id) { return BYID[id]; }).filter(Boolean).slice(0, 300);
    if (pend.length) {
      var r = await fetchJson(S.url, { method: 'POST', body: JSON.stringify({ pin: S.pin, events: pend }) });
      if (r.ok) { r.saved.forEach(markSynced); backupPending(); }
      else if (!r.retry) lastErr = r.error || 'Sheet refused';
    }
    var p = await fetchJson(S.url + '?action=pull&since=' + (META.lastRow || 0) + '&pin=' + encodeURIComponent(S.pin));
    if (!p.ok) { lastErr = p.error || 'Sheet refused'; }
    else {
      if (META.eventId && p.eventId && META.eventId !== p.eventId) { await resetLocal(true); syncing = false; return syncNow(); }
      var cfgChanged = JSON.stringify(p.cfg) !== JSON.stringify(META.cfg);
      META.eventId = p.eventId; META.cfg = p.cfg; META.eventName = p.eventName; META.who = p.who; META.lastRow = p.next;
      META.clockSkew = p.serverTime - Date.now();
      var added = 0;
      p.events.forEach(function (ev) {
        if (!BYID[ev.id]) { EVENTS.push(ev); BYID[ev.id] = ev; putEvent(ev, true); added++; }
        else if (PENDING[ev.id]) markSynced(ev.id);
      });
      await saveMeta();
      lastOk = Date.now(); lastErr = '';
      if (added || cfgChanged) dirty();
    }
  } catch (err) { lastErr = navigator.onLine === false ? 'No internet' : 'Cannot reach Sheet'; }
  syncing = false;
  syncBadge();
  if (Object.keys(PENDING).length) setTimeout(syncNow, 4000);
}
setInterval(syncNow, 5000);
window.addEventListener('online', syncNow);

async function resetLocal(discardPending) {
  var keep = discardPending ? [] : Object.keys(PENDING).map(function (id) { return BYID[id]; }).filter(Boolean);
  await tx('events', 'readwrite', function (s) { return s.clear(); });
  META = { lastRow: 0 };
  await saveMeta();
  EVENTS = []; BYID = {}; PENDING = {};
  keep.forEach(function (e) { EVENTS.push(e); BYID[e.id] = e; PENDING[e.id] = 1; putEvent(e, false); });
  backupPending();
  dirty();
}

function syncBadge() {
  var el = document.getElementById('sync'), n = Object.keys(PENDING).length;
  el.className = '';
  if (S.practice) { el.textContent = 'Practice'; el.className = 'off'; return; }
  if (!S.url || !S.pin) { el.textContent = 'Not connected'; el.className = 'err'; return; }
  if (lastErr) { el.textContent = (lastErr === 'Wrong PIN' ? 'Wrong PIN' : 'Offline') + (n ? ': ' + n + ' waiting' : ''); el.className = lastErr === 'Wrong PIN' ? 'err' : 'off'; return; }
  el.textContent = n ? 'Sending ' + n + '...' : 'Synced';
  if (n) el.className = 'off';
}

/* ================= helpers ================= */
function cfg() { return S.practice ? DEMO_CFG : (META.cfg || { entries: [], starts: [] }); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id) { return document.getElementById(id); }
function toast(msg, kind) {
  var d = document.createElement('div'); d.textContent = msg; if (kind) d.className = kind;
  $('toast').appendChild(d); setTimeout(function () { d.remove(); }, kind === 'err' ? 4500 : 2200);
}
function clock(ms) {
  if (ms == null || ms < 0) return '0:00.0';
  var t = Math.floor(ms / 100), ds = t % 10, s = Math.floor(t / 10) % 60, m = Math.floor(t / 600) % 60, h = Math.floor(t / 36000);
  return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (s < 10 ? '0' : '') + s + '.' + ds;
}
function tod(t) {
  var d = new Date(t), h = d.getHours(), ap = h >= 12 ? 'PM' : 'AM', p2 = function (n) { return String(n).padStart(2, '0'); };
  return ((h % 12) || 12) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds()) + '.' + p2(Math.floor(d.getMilliseconds() / 10)) + ' ' + ap;
}
function parseLap(str) {
  var m = String(str || '').trim().match(/^(?:(\d+):)?(\d+)(?:\.(\d{1,3}))?$/);
  if (!m) return null;
  return ((parseInt(m[1] || '0', 10) * 60) + parseInt(m[2], 10)) * 1000 + (m[3] ? Math.round(parseFloat('0.' + m[3]) * 1000) : 0);
}
function classColor(cls) {
  var list = []; cfg().entries.forEach(function (e) { if (list.indexOf(e.cls) < 0) list.push(e.cls); });
  return COLORS[Math.max(0, list.indexOf(cls)) % COLORS.length];
}
function voided() { return RWO.isVoided(EVENTS); }
function myRole(race) {
  var r = EVENTS.filter(function (e) { return e.type === 'role' && Number(e.race) === Number(race) && e.dev === S.dev; }).sort(function (a, b) { return a.at - b.at; }).pop();
  return r ? r.role : null;
}
function devName(id) {
  if (id === 'EDIT') return 'Edit';
  var e = EVENTS.filter(function (x) { return x.dev === id && x.devName; })[0];
  return e ? e.devName : id;
}
function races() { return RWO.raceNumbers(cfg()); }
function raceLabel(r) { var i = RWO.raceInfo(cfg(), r); return 'Race ' + r + ' (' + i.day + '): ' + i.classes.join(', '); }
function curRace() {
  var list = races();
  if (!list.length) return null;
  if (list.indexOf(Number(S.race)) < 0) { S.race = list[0]; saveS(); }
  return Number(S.race);
}
function raceSelect(id) {
  var r = curRace();
  return '<select id="' + id + '">' + races().map(function (n) { return '<option value="' + n + '"' + (n === r ? ' selected' : '') + '>' + esc(raceLabel(n)) + '</option>'; }).join('') + '</select>';
}
function bindRaceSelect(id) { var el = $(id); if (el) el.onchange = function () { S.race = Number(el.value); saveS(); dirty(); }; }

var RES = {}, DIRTY = true, RAF = 0;
function dirty() { DIRTY = true; RES = {}; if (!RAF) RAF = requestAnimationFrame(function () { RAF = 0; render(); }); }
function result(r) { if (!RES[r]) RES[r] = RWO.computeRace(cfg(), EVENTS, r); return RES[r]; }

/* ================= modal ================= */
function modal(html, onMount) { $('mbox').innerHTML = html; $('modal').classList.add('on'); if (onMount) onMount($('mbox')); }
function closeModal() { $('modal').classList.remove('on'); $('mbox').innerHTML = ''; }
$('modal').addEventListener('click', function (e) { if (e.target.id === 'modal') closeModal(); });

/* ================= tabs ================= */
document.querySelectorAll('#tabs button').forEach(function (b) {
  b.onclick = function () { S.view = b.dataset.v; saveS(); render(); };
});
function render() {

function tapBoat(race, key, tileEl) {
  var t = Date.now(), R = result(race);
  var row = null; R.classes.forEach(function (C) { C.rows.forEach(function (r) { if (r.key === key) row = r; }); });
  if (!row) return;
  if (R.status === 'ENDED') { toast('Race has ended. Reopen it to tap.', 'err'); return; }
  if (R.status === 'RED FLAG') { toast('Red flag: tap START when racing resumes', 'err'); return; }
  if (curSegStartFor(R, row.group) == null) { toast('Tap START for start ' + row.group + ' first', 'err'); return; }
  if (row.status === 'FINISHED') return;
  if (['DNS', 'DNF', 'DQ'].indexOf(row.status) >= 0) { toast('#' + row.num + ' is ' + row.status, 'err'); return; }
  var mine = myLastTap(race, key);
  if (mine && t - mine.t < LOCK_MS) return; // 30 second lock: ignore double taps
  addEvent({ type: 'tap', race: race, boat: key, t: t });
  if (S.practice && S.robots) robotTaps(race, key, t);
  if (tileEl) tileEl.classList.add('flash');
}

function robotTaps(race, key, t) {
  ['ROBOT-1', 'ROBOT-2'].forEach(function (d, i) {
    if (Math.random() < 0.1) return; // robots miss 10% of laps
    var off = 120 + Math.round(Math.random() * 500) + (Math.random() < 0.08 ? 1800 : 0);
    addEvent({ type: 'tap', race: race, boat: key, t: t + off, dev: d, devName: 'Robot ' + (i + 1) });
  });
}

function undoBoat(race, key) {
  var mine = myLastTap(race, key), b = RWO.splitKey(key);
  if (!mine) { toast('No tap from this iPad to undo on #' + b.num, 'err'); return; }
  addEvent({ type: 'void', target: mine.id, race: race, reason: 'Undo' });
  toast('Undid last tap on #' + b.num + ' (' + b.cls + ')', 'ok');
}

function endRace(race) {
  if (myRole(race) !== 'main' && !confirm('This iPad is not the Main iPad. Only the Main iPad should end the race. Continue?')) return;

}

function redFlag(race) {
  var t = Date.now(), R = result(race);

  var mode = 'running', inputMode = 'left';

    var lead = 0; C.rows.forEach(function (r) { var n = r.lapList.filter(function (l) { return l.t < t; }).length; if (n > lead) lead = n; });
    return { cls: C.cls, laps: C.laps, lead: lead };
  });
  function draw() {
    var h = '<h2 style="color:var(--red)">RED FLAG at ' + tod(t) + '</h2>' +
      '<button class="opt ' + (mode === 'running' ? 'on' : '') + '" data-m="running"><b>Restart in running order</b>Laps already completed are kept. The lap in progress is dropped.</button>' +
      '<button class="opt ' + (mode === 'original' ? 'on' : '') + '" data-m="original"><b>Restart in original order</b>For a red flag before lap 1 is finished. All laps so far are voided (kept in the log).</button>' +
      '<button class="opt ' + (mode === 'called' ? 'on' : '') + '" data-m="called"><b>Call the race (no restart)</b>Each class is scored at the last lap its leader completed.</button>';
    if (mode === 'running') {
      h += '<div class="seg" style="margin:8px 0"><button data-im="left" class="' + (inputMode === 'left' ? 'on' : '') + '">Enter laps left</button><button data-im="total" class="' + (inputMode === 'total' ? 'on' : '') + '">Enter new total</button></div>';
      info.forEach(function (c, i) {
        var def = inputMode === 'left' ? Math.max(0, c.laps - c.lead) : c.laps;
        h += '<label class="f">' + esc(c.cls) + ': leader has ' + c.lead + ' of ' + c.laps + ' laps. ' + (inputMode === 'left' ? 'Laps left after restart:' : 'New total laps:') + '</label>' +
          '<input class="f" type="number" inputmode="numeric" min="0" data-i="' + i + '" value="' + def + '"><div class="muted" id="rfnote' + i + '"></div>';
      });
    } else if (mode === 'original') {
      info.forEach(function (c, i) {
        h += '<label class="f">' + esc(c.cls) + ': new total laps</label><input class="f" type="number" inputmode="numeric" min="1" data-i="' + i + '" value="' + c.laps + '">';
      });
    }

    box.querySelectorAll('[data-im]').forEach(function (b) { b.onclick = function () { inputMode = b.dataset.im; draw(); }; });

      if (mode !== 'running') return;

        var c = info[inp.dataset.i], v = parseInt(inp.value, 10) || 0;

      });
    }

          order.map(function (x, i) { return '<div class="bar"><b style="width:40px">' + (i + 1) + '</b><span style="flex:1">#' + esc(x.num) + ' ' + esc(x.team) + ' (' + x.apba + ' pts)</span><button class="btn small gray" data-up="' + i + '">Up</button><button class="btn small gray" data-dn="' + i + '">Down</button></div>'; }).join('') +

  });

    (S.practice ? '<button class="btn ' + (S.robots ? 'gray' : '') + '" id="sRob">' + (S.robots ? 'Robot backups: ON' : 'Robot backups: OFF') + '</button><button class="btn red" id="sReset">Erase practice data</button>' : '') + '</div>' +
    (S.practice ? '<p class="muted">Robot backups pretend to be Backup iPads 1 and 2: they tap a fraction of a second after you, sometimes late and sometimes not at all, so you can practice the Review tab.</p>' : '') + '</div>';
  h += '<div class="card"><h3>Tools</h3><div class="bar"><button class="btn gray" id="sReload">Reload everything from Sheet</button><button class="btn gray" id="sExport">Download a backup of this iPad\'s data</button></div>' +
    '<p class="muted">iPad ID ' + esc(S.dev) + ' &middot; App version ' + VERSION + '</p></div>';
  var el = $('v-settings'); el.innerHTML = h;
  $('sSave').onclick = function () {
    S.url = $('sUrl').value.trim(); S.pin = $('sPin').value.trim(); S.devName = $('sName').value.trim() || S.dev; saveS();
    lastErr = ''; toast('Saved. Connecting...'); syncNow().then(function () { toast(lastErr ? 'Problem: ' + lastErr : 'Connected', lastErr ? 'err' : 'ok'); render(); });
  };
  $('sSync').onclick = function () { syncNow().then(render); };
  $('sPrac').onclick = async function () { S.practice = !S.practice; saveS(); await initData(); if (S.practice && !S.robots) { S.robots = true; saveS(); } render(); };
  var rb = $('sRob'); if (rb) rb.onclick = function () { S.robots = !S.robots; saveS(); render(); };
  var rs = $('sReset'); if (rs) rs.onclick = async function () { if (confirm('Erase all practice data?')) { await resetLocal(false); render(); } };
  $('sReload').onclick = async function () {
    if (!confirm('Reload all data from the Sheet? Taps not yet sent stay on this iPad and will still be sent.')) return;
    await resetLocal(false); syncNow().then(render);
  };
  $('sExport').onclick = function () {
    var blob = new Blob([JSON.stringify({ device: S.dev, name: S.devName, exported: new Date().toISOString(), events: EVENTS }, null, 1)], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'rwo-backup-' + (S.devName || S.dev) + '-' + Date.now() + '.json'; a.click();
  };
}

/* ================= start ================= */
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
initData().then(function () {
  if (!S.practice && (!S.url || !S.pin)) S.view = 'settings';
  render(); syncNow();
}).catch(function (err) { document.body.innerHTML = '<div style="padding:20px;font-size:18px">This iPad could not open its storage: ' + esc(err) + '. Make sure Safari is not in Private mode.</div>'; });
</script>
</body>
</html>
